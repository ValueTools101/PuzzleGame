name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-dijkstra-3cjflh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js privacy.html .nojekyll _site/
          cp -r icons _site/icons
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
